<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315b4c">
<title>彌勒山12人小組勤務安排</title>

<!-- Google Visualization Query：直接讀取已「發布到網路」的 Google 試算表 -->
<script src="https://www.gstatic.com/charts/loader.js"></script>

<style>
:root{
  --bg:#f4f6f3;--ink:#17201c;--muted:#4f5d55;--line:#c8d0cc;
  --brand:#e8a76f;--brand-dark:#d98b4f;--brand-soft:#fff1e4;
  --warn-bg:#fff3e6;--warn-line:#efc39f;--warn-ink:#7b4c26;
  --accent:#c66b3d;--today:#fff0dc;--today-head:#f4c18f;
  --shadow:0 10px 28px rgba(32,58,48,.08)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}

.notice{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;min-height:64px;padding:7px 12px;background:var(--warn-bg);border-bottom:1px solid var(--warn-line);color:var(--warn-ink)}
.notice-icon{font-size:18px;flex:0 0 auto}
.notice-window{position:relative;height:50px;flex:1;overflow:hidden}
.notice-item{position:absolute;inset:0;display:flex;align-items:center;font-size:18px;line-height:1.65;font-weight:900;opacity:0;transform:translateY(110%);transition:transform .55s ease,opacity .42s ease;white-space:normal}
.notice-item.show{opacity:1;transform:translateY(0)}
.notice-item.out{opacity:0;transform:translateY(-110%)}

.hero{background:linear-gradient(135deg,#d98b4f,#efb27e);color:#fff;padding:18px 14px 15px}
.hero-inner{max-width:1500px;margin:0 auto}
h1{margin:0;font-size:clamp(30px,4.5vw,42px);line-height:1.2}
.sub{margin-top:6px;font-size:18px;opacity:.96}
.sync{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;opacity:.94}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#ffd0aa;box-shadow:0 0 0 3px rgba(255,208,170,.18)}
.wrap{max-width:1500px;margin:0 auto;padding:10px 10px 22px}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:9px}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:11px 16px;border-radius:12px;font-weight:900;font-size:17px;cursor:pointer}
.hint{margin-left:0;color:var(--muted);font-size:15px}
.shell{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 150px);overscroll-behavior:contain}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;table-layout:fixed;background:#fff}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
tr>*:last-child{border-right:0}
tbody tr:last-child>*{border-bottom:0}
.corner,.row-label{position:static;width:58px;min-width:58px;max-width:58px;background:#f8faf8;font-weight:900}
.group-row th{position:sticky;top:0;z-index:20;height:44px;padding:7px 8px;background:var(--brand-soft);color:#8a5128;font-size:16px;font-weight:900;vertical-align:middle}

.date-row th{position:sticky;top:44px;z-index:19;height:64px;padding:7px 8px;background:#edf2ef;font-size:23px;font-weight:900;white-space:nowrap;vertical-align:middle}

.time-row th{position:sticky;top:108px;z-index:18;height:88px;padding:8px 7px;background:#fbfcfb;color:#b85e34;font-size:16px;line-height:1.55;font-weight:900;white-space:normal;overflow:visible;vertical-align:middle}
.time-row .corner{color:var(--ink)}
.day-col{width:170px;min-width:170px;max-width:170px}
.today-col{background:var(--today)!important}
.date-row .today-col{background:var(--today-head)!important;color:#78451f}
.today-mark{display:block;margin-top:2px;font-size:10px;color:#7a4a24;font-weight:900}
tbody td{height:60px;padding:9px 8px;background:#fff;font-size:22px;line-height:1.3;word-break:break-word}
tbody tr:nth-child(even) td:not(.today-col){background:#fbfcfb}
.person{font-size:22px;font-weight:900}.empty{color:#c9d0cc}.group-start{border-left:3px solid #e3b38a!important}
.notes-row td{height:auto;padding:8px;text-align:left;background:#fbf9f1;color:#625c4f;font-size:16px;line-height:1.6}
.notes-row .row-label{text-align:center;background:#f4f2eb;color:var(--ink)}
.status{padding:42px 18px;text-align:center;color:var(--muted)}
.error-title{font-weight:900;color:#8f3f34;margin-bottom:7px}
.footer{padding:9px 6px 0;text-align:center;color:var(--muted);font-size:15px}

@media(max-width:640px){
  .notice{min-height:72px;padding:8px 10px}
  .notice-window{height:56px}
  .notice-item{font-size:17px;line-height:1.65}

  .hero{padding:16px 12px 14px}
  h1{font-size:28px;line-height:1.25}
  .sub{font-size:17px}
  .sync{font-size:14px}
  .wrap{padding:8px 6px 16px}

  .toolbar{gap:10px}
  button{font-size:17px;padding:11px 15px}
  .hint{width:100%;margin-left:0;font-size:14px;line-height:1.5}

  .shell{border-radius:10px}
  .scroll{max-height:calc(100vh - 150px)}

  .corner,.row-label{
    position:static;
    width:52px;min-width:52px;max-width:52px;
    font-size:15px
  }

  .day-col{
    width:154px;min-width:154px;max-width:154px
  }

  .group-row th{
    height:42px;padding:6px 4px;font-size:15px
  }

  .date-row th{
    top:42px;height:60px;padding:7px 5px;font-size:21px
  }

  .time-row th{
    top:102px;height:86px;padding:8px 5px;font-size:16px;line-height:1.55;overflow:visible
  }

  tbody td{
    height:56px;padding:8px 5px;font-size:20px
  }

  .person{font-size:20px;font-weight:900}
  .notes-row td{font-size:15px;line-height:1.6}
  .footer{font-size:13px;line-height:1.5}
}
</style>
</head>
<body>

<div class="notice" id="notice" hidden>
  <div class="notice-icon">🔔</div>
  <div class="notice-window">
    <div class="notice-item show" id="noticeA"></div>
    <div class="notice-item" id="noticeB"></div>
  </div>
</div>

<section class="hero">
  <div class="hero-inner">
    <h1 id="title">9/27(日)~10/4(日) 彌勒山12人小組</h1>
    <div class="sub" id="subtitle">9/27（日）～10/4（日）</div>
    <div class="sync">
      <span><span class="dot"></span><span id="syncText">正在連線 Google 試算表…</span></span>
      <span id="updated"></span>
    </div>
  </div>
</section>

<main class="wrap">
  <div class="shell">
    <div class="scroll" id="tableScroll">
      <div id="content" class="status">正在讀取勤務表…</div>
    </div>
  </div>
  <div class="footer">每 30 秒自動同步 Google 試算表；內容有變更才更新。｜已採大字、高對比版面。</div>
</main>

<script>
const CONFIG = {
  SPREADSHEET_ID:'1GEE-2ISgzqAca-SblK2SSu8e7a_rlwyrkjH73wiHiW4',
  DATA_GID:'303688467',
  SETTINGS_GID:'987654321',
  CHECK_MS:30000,
  NOTICE:'初步先了解能夠參與的日期，如果有不過夜，請明確告知參與的時間範圍'
};

let currentData=null;
let currentHash='';
let timer=null;
let noticeTimer=null;
let noticeMessages=[];
let noticeIndex=0;
let querySerial=0;

const $=id=>document.getElementById(id);

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') refresh(false);
});

google.charts.load('current',{packages:['table']});
google.charts.setOnLoadCallback(()=>refresh(true));

function queryUrl(gid,range){
  return 'https://docs.google.com/spreadsheets/d/'+CONFIG.SPREADSHEET_ID+
         '/gviz/tq?gid='+encodeURIComponent(gid)+
         '&range='+encodeURIComponent(range)+
         '&headers=1'+
         '&_='+Date.now()+'_'+(++querySerial);
}

function runQuery(gid,range){
  return new Promise((resolve,reject)=>{
    try{
      const query=new google.visualization.Query(queryUrl(gid,range));
      query.setQuery('select *');
      query.send(response=>{
        if(response.isError()){
          reject(new Error(response.getMessage()+(response.getDetailedMessage()?'：'+response.getDetailedMessage():'')));
          return;
        }
        resolve(dataTableToRows(response.getDataTable()));
      });
    }catch(err){
      reject(err);
    }
  });
}

function dataTableToRows(dt){
  const rows=[];

  // GViz 會把試算表第一列當成欄位標題，不放在資料列中。
  // 這裡把欄位標題補回第一列，才能和原始 Google Sheet 列號完全一致。
  const header=[];
  for(let c=0;c<dt.getNumberOfColumns();c++){
    header.push(String(dt.getColumnLabel(c) || ''));
  }
  rows.push(header);

  for(let r=0;r<dt.getNumberOfRows();r++){
    const row=[];
    for(let c=0;c<dt.getNumberOfColumns();c++){
      let v=dt.getFormattedValue(r,c);
      if(v==null || v===''){
        const raw=dt.getValue(r,c);
        v=raw==null?'':String(raw);
      }
      row.push(String(v??''));
    }
    rows.push(row);
  }
  return rows;
}

async function refresh(force){
  clearTimeout(timer);
  if(force)setSync('正在更新…');

  try{
    const dataRows=await runQuery(CONFIG.DATA_GID,'A1:I100');

    let settingsRows=[];
    try{
      settingsRows=await runQuery(CONFIG.SETTINGS_GID,'A1:B30');
    }catch(_){
      // 設定頁抓不到不影響勤務表，公告使用預設文字。
    }

    const data=buildData(dataRows,settingsRows);
    const hash=JSON.stringify(data);

    if(force || hash!==currentHash){
      currentHash=hash;
      currentData=data;
      render(data);
    }else{
      setSync('已同步');
      $('updated').textContent='最近檢查：'+nowText();
    }
  }catch(err){
    showError(err);
  }finally{
    timer=setTimeout(()=>refresh(false),CONFIG.CHECK_MS);
  }
}

function buildData(rows,settingsRows){
  if(!rows || rows.length<4) throw new Error('Google 試算表沒有回傳完整勤務資料');

  const title=cell(rows,0,0)||'彌勒山12人小組勤務安排';
  const groupRow=padSlice(rows[1]||[],1,9);
  const dateRow=padSlice(rows[2]||[],1,9);
  const timeRow=padSlice(rows[3]||[],1,9);

  let noteIndex=rows.findIndex(r=>String(r[0]||'').trim()==='備註');
  if(noteIndex<0)noteIndex=rows.length;

  const labels=[];
  for(let r=4;r<noteIndex;r++){
    const x=cell(rows,r,0).trim();
    if(x)labels.push(x);
  }

  const groups=[];
  let currentGroup='';
  for(let i=0;i<8;i++){
    const g=String(groupRow[i]||'').replace(/\s+/g,' ').trim();
    if(g)currentGroup=g;
    groups.push(currentGroup);
  }

  const days=[];
  for(let c=0;c<8;c++){
    const dateText=String(dateRow[c]||'').trim();
    if(!dateText)continue;

    const people=[];
    for(let r=4;r<noteIndex;r++){
      const name=cell(rows,r,c+1).trim();
      if(name)people.push({no:cell(rows,r,0).trim(),name});
    }

    const notes=[];
    for(let r=noteIndex;r<rows.length;r++){
      const n=cell(rows,r,c+1).trim();
      if(n)notes.push(n);
    }

    days.push({
      dateText,
      isoDate:toIso(dateText),
      group:groups[c]||'',
      time:String(timeRow[c]||'').trim(),
      people,
      notes
    });
  }

  const settings={};
  settingsRows.forEach((r,i)=>{
    if(i===0)return;
    const k=String(r[0]||'').trim();
    if(k)settings[k]=String(r[1]||'').trim();
  });

  return {
    title,
    subtitle:settings['頁面副標題']||'9/27（日）～10/4（日）',
    announcement:settings['跑馬燈公告']||settings['上翻式公告']||CONFIG.NOTICE,
    rowLabels:labels,
    days,
    today:todayIso()
  };
}

function render(data){
  $('title').textContent=data.title;
  $('subtitle').textContent=data.subtitle;
  setupNotice(data.announcement);
  $('content').className='';
  $('content').innerHTML=buildTable(data);
  setSync('已同步');
  $('updated').textContent='最後更新：'+nowText()+'｜每 30 秒檢查';
}

function setupNotice(text){
  clearInterval(noticeTimer);
  noticeMessages=String(text||'')
    .split(/｜|\n|，|。/)
    .map(s=>s.trim())
    .filter(Boolean);
  noticeIndex=0;

  if(!noticeMessages.length){
    $('notice').hidden=true;
    return;
  }

  $('notice').hidden=false;
  const a=$('noticeA'),b=$('noticeB');
  a.textContent=noticeMessages[0];
  a.className='notice-item show';
  b.className='notice-item';
  b.textContent=noticeMessages[1]||noticeMessages[0];

  noticeTimer=setInterval(()=>{
    const next=(noticeIndex+1)%noticeMessages.length;
    b.textContent=noticeMessages[next]||noticeMessages[0];
    b.className='notice-item';
    void b.offsetWidth;
    a.classList.add('out');
    a.classList.remove('show');
    b.classList.add('show');

    setTimeout(()=>{
      noticeIndex=next;
      a.textContent=b.textContent;
      a.className='notice-item show';
      b.className='notice-item';
    },580);
  },5200);
}

function buildTable(data){
  if(!data.days.length)return '<div class="status">目前沒有勤務資料。</div>';

  const labels=data.rowLabels.length?data.rowLabels:Array.from({length:17},(_,i)=>String(i+1));
  const gs=groupSpans(data.days);

  const groupHtml=gs.map(g=>
    `<th class="day-col ${g.start?'group-start':''}" colspan="${g.span}">${esc(g.name)}</th>`
  ).join('');

  const dateHtml=data.days.map((d,i)=>
    `<th class="day-col ${todayClass(d,data)} ${groupStart(data.days,i)}">
      ${esc(d.dateText)}
      ${d.isoDate===data.today?'<span class="today-mark">今天</span>':''}
    </th>`
  ).join('');

  const timeHtml=data.days.map((d,i)=>
    `<th class="day-col ${todayClass(d,data)} ${groupStart(data.days,i)}">
      ${d.time?esc(d.time).replace(/\n/g,'<br>'):'—'}
    </th>`
  ).join('');

  const body=labels.map(label=>{
    const tds=data.days.map((d,i)=>{
      const p=(d.people||[]).find(x=>String(x.no)===String(label));
      return `<td class="day-col ${todayClass(d,data)} ${groupStart(data.days,i)}">
        ${p?`<span class="person">${esc(p.name)}</span>`:'<span class="empty">—</span>'}
      </td>`;
    }).join('');
    return `<tr><th class="row-label">${esc(label)}</th>${tds}</tr>`;
  }).join('');

  const hasNotes=data.days.some(d=>d.notes&&d.notes.length);
  const notes=hasNotes?`
    <tr class="notes-row">
      <th class="row-label">備註</th>
      ${data.days.map((d,i)=>`
        <td class="day-col ${todayClass(d,data)} ${groupStart(data.days,i)}">
          ${(d.notes||[]).map(esc).join('<br>')}
        </td>`).join('')}
    </tr>`:'';

  return `<table>
    <thead>
      <tr class="group-row"><th class="corner">小組</th>${groupHtml}</tr>
      <tr class="date-row"><th class="corner">日期</th>${dateHtml}</tr>
      <tr class="time-row"><th class="corner">時間</th>${timeHtml}</tr>
    </thead>
    <tbody>${body}${notes}</tbody>
  </table>`;
}

function groupSpans(days){
  const out=[];let start=0;
  while(start<days.length){
    const name=days[start].group||'';
    let end=start+1;
    while(end<days.length&&(days[end].group||'')===name)end++;
    out.push({name,span:end-start,start:start>0});
    start=end;
  }
  return out;
}

function groupStart(days,i){
  if(i<=0)return '';
  return (days[i].group||'')!==(days[i-1].group||'')?'group-start':'';
}
function todayClass(d,data){return d.isoDate===data.today?'today-col':''}

function jumpToday(){
  if(!currentData)return;
  const i=currentData.days.findIndex(d=>d.isoDate===currentData.today);
  if(i<0){alert('今天不在這次勤務日期範圍內。');return}
  const target=document.querySelectorAll('.date-row .day-col')[i];
  if(target)$('tableScroll').scrollTo({left:Math.max(0,target.offsetLeft-42),top:0,behavior:'smooth'});
}

function cell(rows,r,c){return String((rows[r]&&rows[r][c])??'')}
function padSlice(arr,a,b){const o=[];for(let i=a;i<b;i++)o.push(String(arr[i]??''));return o}
function toIso(text){
  const m=String(text).match(/(\d{1,2})\/(\d{1,2})/);
  return m?`2026-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`:'';
}
function todayIso(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const o={};p.forEach(x=>o[x.type]=x.value);
  return `${o.year}-${o.month}-${o.day}`;
}
function nowText(){
  return new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
}
function setSync(t){$('syncText').textContent=t}
function showError(err){
  setSync('同步失敗');
  $('updated').textContent='稍後自動重試';
  $('content').className='status';
  $('content').innerHTML=
    '<div class="error-title">目前無法讀取 Google 試算表</div>'+
    '<div>請確認這份試算表仍保持「發布到網路」。</div>'+
    '<div style="margin-top:6px;font-size:15px">'+esc(err?.message||String(err))+'</div>';
}
function esc(v){
  return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
</script>
</body>
</html>
